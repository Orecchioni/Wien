<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vienna — 10/13 ottobre 2026</title>
<meta name="description" content="Itinerario di viaggio a Vienna, 10–13 ottobre 2026.">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vienna">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="checker" aria-hidden="true"></div>

<header class="masthead">
  <div class="shell">
    <p class="masthead__meta" id="tripMeta"></p>
    <h1 class="masthead__title">Vienna</h1>
    <p class="masthead__dates" id="tripDates"></p>
    <p class="masthead__base" id="tripBase"></p>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Giornate e biglietti">
  <div class="shell tabs__inner" role="tablist" id="tablist"></div>
  <div class="tabs__rule" aria-hidden="true"></div>
</nav>

<main class="shell" id="panels"></main>

<footer class="footer shell">
  <div class="footer__block">
    <h2 class="footer__title">Azzera le spunte</h2>
    <p class="footer__text">Rimuove tutte le tappe segnate come fatte. I dati dei biglietti restano.</p>
    <button type="button" class="btn btn--danger" id="resetBtn">Azzera tutte le spunte</button>
    <p class="footer__confirm" id="resetConfirm" hidden>
      <span class="footer__confirmText">Sicuro? L'operazione non si annulla.</span>
      <span class="footer__confirmRow">
        <button type="button" class="btn btn--danger" id="resetYes">Sì, azzera</button>
        <button type="button" class="btn" id="resetNo">Annulla</button>
      </span>
    </p>
  </div>
  <p class="footer__sign">Blackhome Wien · Neulinggasse 29, 1030 Wien</p>
</footer>

<div class="checker checker--foot" aria-hidden="true"></div>

<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
